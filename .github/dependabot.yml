version: 2
updates:

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    reviewers:
      - "OpenNMS/dependabot-reviewers-maven"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "daily"
    ignore:
      # Karaf must stay aligned with the Meridian foundation branches
      # (2023/2024/2025 all ship Karaf 4.3.10). Building against 4.4+
      # produces an Import-Package range [4.4,5) that fails to resolve
      # there. See PR #135.
      - dependency-name: "org.apache.karaf*"
        versions: [">= 4.4.0"]
      # slf4j 2.x widens the bundle's org.slf4j import to [2.0,3), which
      # Karaf 4.3.10 (pax-logging exports 1.7.x) cannot resolve. Chained
      # behind the Karaf 4.4 upgrade above. See PR #93.
      - dependency-name: "org.slf4j*"
        versions: [">= 2.0.0"]
      # kotlin.version pins the kotlin-stdlib that backs okhttp 4.12.0,
      # which is built against kotlin 1.9.x. In kotlin 2.x the managed
      # kotlin-stdlib-jdk8/-common artifacts are empty relocation shells,
      # so the pin stops working. Lift when okhttp moves to a kotlin
      # 2.x-based release. See PR #143.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.0.0"]
      # okhttp 5.x is built against kotlin 2.x, which the kotlin.version pin
      # above deliberately holds at 1.9.x, and the Karaf feature still ships
      # the servicemix okhttp 3.13.1_1 bundle at runtime. Chained behind the
      # kotlin 2.x entry above. See PR #149.
      - dependency-name: "com.squareup.okhttp3*"
        versions: [">= 5.0.0"]
      # istack-commons-runtime is not a dependency of this plugin: it enters
      # only via org.apache.karaf.features:framework:kar at provided scope,
      # and the pin exists to match what that Karaf ships. Karaf 4.3.10
      # ships 3.0.12 (javax.activation); istack 4.x exports com.sun.istack
      # against jakarta.activation [2.1,3) and requires JavaSE 11. Bumping it
      # silently changes the environment karaf-maven-plugin:verify resolves
      # against, weakening the gate that protects Meridian compatibility.
      # Chained behind the Karaf 4.4 upgrade above. See PR #150.
      - dependency-name: "com.sun.istack*"
        versions: [">= 4.0.0"]
